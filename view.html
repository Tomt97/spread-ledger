<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Trading progress · Spread Ledger</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Read-only progress page: header, timeframe row, KPI strip, cumulative + monthly charts, calendar, strategies, trade list */
:root{
  --bg:#eef1f0; --surface:#ffffff; --sunk:#e5eae8; --ink:#14201b; --muted:#5a6a63; --line:#d3dbd7;
  --accent:#2747c7; --accent-soft:#e3e8fb; --gain:#167a46; --gain-soft:#dcefe4; --loss:#bf3226; --loss-soft:#f7e0dd;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace; --r:10px;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#161d1a; --sunk:#1c2420; --ink:#e4ebe7; --muted:#93a39b; --line:#29342f;
  --accent:#8ea3ff; --accent-soft:#1f2747; --gain:#45c483; --gain-soft:#173326; --loss:#ff7466; --loss-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#161d1a; --sunk:#1c2420; --ink:#e4ebe7; --muted:#93a39b; --line:#29342f;
  --accent:#8ea3ff; --accent-soft:#1f2747; --gain:#45c483; --gain-soft:#173326; --loss:#ff7466; --loss-soft:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--display);font-size:15px;line-height:1.45}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:16px}
h1,h2{margin:0;font-family:var(--display);text-wrap:balance}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
.top h1{font-size:28px;font-weight:800;font-stretch:110%}
.brand{font-size:13px;color:var(--muted)} .brand b{color:var(--ink)} .brand i{color:var(--accent);font-style:normal}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.muted{color:var(--muted)} .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.card{padding:16px;display:grid;gap:10px;min-width:0}
.card h2{font-size:16px;font-weight:700}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:3px;border-radius:9px;overflow-x:auto}
.tabs button{border:none;background:none;padding:6px 12px;border-radius:7px;font:inherit;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;flex:none}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.kpi{background:var(--surface);padding:14px 16px;display:grid;gap:4px;min-width:0}
.kpi .v{font-family:var(--mono);font-size:23px;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi .s{font-size:12.5px;color:var(--muted)}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
svg{display:block;max-width:100%}
svg text{fill:var(--muted);font-family:var(--mono);font-size:11px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line)} td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:none}
.scroll{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 10px;font:inherit;font-weight:600;cursor:pointer;color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;padding:2px 4px}
.cday{border-radius:6px;background:var(--sunk);min-height:58px;padding:5px 6px;display:grid;align-content:space-between;min-width:0}
.cday.out{background:transparent}
.cday .d{font-size:11px;color:var(--muted)} .cday .v{font-family:var(--mono);font-size:12px;font-weight:600;white-space:nowrap}
.g1{background:color-mix(in srgb,var(--gain) 14%,var(--surface))!important}.g2{background:color-mix(in srgb,var(--gain) 30%,var(--surface))!important}.g3{background:color-mix(in srgb,var(--gain) 50%,var(--surface))!important}
.l1{background:color-mix(in srgb,var(--loss) 14%,var(--surface))!important}.l2{background:color-mix(in srgb,var(--loss) 30%,var(--surface))!important}.l3{background:color-mix(in srgb,var(--loss) 50%,var(--surface))!important}
.empty{padding:40px 16px;text-align:center;color:var(--muted)} .empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.foot{font-size:12.5px;color:var(--muted);text-align:center}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.open{background:var(--accent-soft);color:var(--accent)} .pill.win{background:var(--gain-soft);color:var(--gain)} .pill.lossp{background:var(--loss-soft);color:var(--loss)} .pill.flat{background:var(--sunk);color:var(--muted)}
.sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
tr.trow{cursor:pointer} tr.trow:hover{background:var(--sunk)} tr.trow[aria-expanded="true"]{background:var(--sunk)}
tr.drow td{background:var(--sunk);padding:12px 14px}
.det{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.facts div{background:var(--surface);padding:7px 9px;display:grid;gap:1px}
.facts .v{font-family:var(--mono);font-weight:600;font-size:13.5px}
.order{font-family:var(--mono);font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;overflow-wrap:anywhere}
.legs{font-size:13px;display:grid;gap:2px}
.show-sm{display:none}
@media (max-width:760px){ .det{grid-template-columns:1fr;max-width:calc(100vw - 62px)} .hide-sm{display:none} .show-sm{display:inline} tr.drow td{padding:10px} td,th{padding:8px 6px} }
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} .split{grid-template-columns:1fr}
  .kpi .v{font-size:19px} .cday{min-height:44px;padding:4px} .cday .v{font-size:10px;letter-spacing:-.03em}
  .top h1{font-size:23px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="display:grid;gap:4px">
      <span class="brand">Spread<i>/</i>Ledger · <span class="badge">View only</span></span>
      <h1 id="title">Trading progress</h1>
      <span class="muted" id="sub" style="font-size:13.5px">Loading…</span>
    </div>
    <button class="btn" type="button" id="refresh">Refresh</button>
  </header>
  <main id="main" style="display:grid;gap:16px"></main>
  <p class="foot">Shared from Spread Ledger. View only: nothing on this page can be changed, and opening it doesn't affect your own account.</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./config.js";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad2 = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; };
const isoAdd = (iso, months, days = 0) => { const [y,m,d] = iso.split("-").map(Number); const t = new Date(y, m-1+months, d+days); return `${t.getFullYear()}-${pad2(t.getMonth()+1)}-${pad2(t.getDate())}`; };
const fmtShort = iso => { const [y,m,d] = iso.split("-").map(Number); return `${MON[m-1]} ${d} ’${String(y).slice(2)}`; };
const money = v => v == null || !isFinite(v) ? "—" : (v < 0 ? "−$" : v > 0 ? "+$" : "$") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = v => (v < 0 ? "−$" : "$") + Math.abs(Math.round(v)).toLocaleString("en-US");
const compact = v => { const a = Math.abs(v), s = v < 0 ? "−" : "+"; return a >= 10000 ? `${s}$${(a/1000).toFixed(0)}k` : a >= 1000 ? `${s}$${(a/1000).toFixed(1)}k` : `${s}$${Math.round(a)}`; };
const cls = v => v > 0.005 ? "gain" : v < -0.005 ? "loss" : "";

const id = new URLSearchParams(location.search).get("s") || "";
let data = null, range = "all", calMonth = "";
try { range = localStorage.getItem("ledger-view-range") || "all"; } catch {}

const app = initializeApp(firebaseConfig);
const fs = initializeFirestore(app, { experimentalAutoDetectLongPolling: true });

async function load(){
  if (!/^[A-Za-z0-9_-]{16,64}$/.test(id)){ return showMsg("This share link is incomplete", "Ask the person who sent it for the full link."); }
  try {
    const snap = await getDoc(doc(fs, "shares", id));
    if (!snap.exists()) return showMsg("This share link isn't active", "It may have been turned off. Ask the person who sent it for a new link.");
    const raw = snap.data();
    // Stored as records (Firestore has no nested arrays); turn them into rows for the charts.
    data = {...raw,
      daily: (raw.daily || []).map(o => [o.d, o.p, o.n, o.w]),
      strategies: (raw.strategies || []).map(o => [o.s, o.n, o.w, o.p]),
      trades: raw.trades ? raw.trades.map(o => [o.o || "", o.c, o.s, o.u, o.q, o.p]) : null,
      full: raw.full || null};
    render();
  } catch (e) {
    if (e && e.code === "permission-denied") showMsg("This share link isn't available", "The owner needs to publish the latest Firebase rules, or sharing was turned off.");
    else showMsg("Couldn't load this page", "Check your connection and press Refresh.");
  }
}
function showMsg(t, s){ $("#sub").textContent = ""; $("#main").innerHTML = `<div class="panel empty"><b>${esc(t)}</b>${esc(s)}</div>`; }
$("#refresh").addEventListener("click", () => { $("#sub").textContent = "Refreshing…"; load(); });

function bounds(){
  const t = todayISO();
  return {all: null, "1m": [isoAdd(t,-1,1), t], "3m": [isoAdd(t,-3,1), t], "6m": [isoAdd(t,-6,1), t], ytd: [t.slice(0,4)+"-01-01", t], "1y": [isoAdd(t,-12,1), t]}[range] || null;
}
function render(){
  const D = data, b = bounds();
  document.title = `${D.title || "Trading progress"} · Spread Ledger`;
  $("#title").textContent = D.title || "Trading progress";
  const upd = D.updatedAt ? new Date(D.updatedAt) : null;
  $("#sub").textContent = `${D.acctLabel || ""}${upd ? ` · updated ${upd.toLocaleString([], {month: "short", day: "numeric", hour: "numeric", minute: "2-digit"})}` : ""}`;
  // daily rows: [date, pnl, trades, wins]
  const days = (D.daily || []).filter(r => !b || (r[0] >= b[0] && r[0] <= b[1])).sort((a, c) => a[0].localeCompare(c[0]));
  const total = days.reduce((a, r) => a + r[1], 0), n = days.reduce((a, r) => a + r[2], 0), w = days.reduce((a, r) => a + r[3], 0);
  let cum = 0, peak = 0, dd = 0; const curve = days.map(r => { cum += r[1]; peak = Math.max(peak, cum); dd = Math.max(dd, peak - cum); return [r[0], cum]; });
  const best = days.slice().sort((a, c) => c[1] - a[1])[0], worst = days.slice().sort((a, c) => a[1] - c[1])[0];
  const names = {all: "All", "1m": "1M", "3m": "3M", "6m": "6M", ytd: "YTD", "1y": "1Y"};
  const months = {}; days.forEach(r => { const k = r[0].slice(0, 7); months[k] = (months[k] || 0) + r[1]; });
  $("#main").innerHTML = `
    <div class="tabs" role="group" aria-label="Timeframe" style="justify-self:start">${Object.entries(names).map(([k, v]) => `<button type="button" data-range="${k}" aria-pressed="${range === k}">${v}</button>`).join("")}</div>
    <section class="kpis" aria-label="Summary">
      <div class="kpi"><span class="label">Net P&amp;L</span><span class="v ${cls(total)}">${n ? money(total) : "$0.00"}</span><span class="s">${n} closed trade${n === 1 ? "" : "s"} · ${D.openCount || 0} open now</span></div>
      <div class="kpi"><span class="label">Win rate</span><span class="v">${n ? (w / n * 100).toFixed(1) + "%" : "—"}</span><span class="s">${w} won · ${n - w} lost or flat</span></div>
      <div class="kpi"><span class="label">Avg per trade</span><span class="v ${cls(total / (n || 1))}">${n ? money(total / n) : "—"}</span><span class="s">${best && best[1] > 0 ? `best day ${fmtShort(best[0])} <span class="gain">${compact(best[1])}</span>` : "&nbsp;"}</span></div>
      <div class="kpi"><span class="label">Max drawdown</span><span class="v ${dd > 0 ? "loss" : ""}">${dd > 0 ? money(-dd) : "$0.00"}</span><span class="s">${worst && worst[1] < 0 ? `worst day ${fmtShort(worst[0])} <span class="loss">${compact(worst[1])}</span>` : "from peak, by day"}</span></div>
    </section>
    <div class="split">
      <section class="panel card"><div class="card-head"><h2>Cumulative P&amp;L</h2><span class="muted" style="font-size:13px">${days.length} trading day${days.length === 1 ? "" : "s"}</span></div>${lineChart(curve)}</section>
      <section class="panel card"><div class="card-head"><h2>By month</h2></div>${barChart(Object.entries(months).sort())}</section>
    </div>
    <section class="panel card"><div class="card-head"><h2>P&amp;L calendar</h2>
      <div style="display:flex;gap:6px;align-items:center"><button class="btn" type="button" data-cal="-1" aria-label="Previous month">‹</button><b id="calM" style="min-width:96px;text-align:center"></b><button class="btn" type="button" data-cal="1" aria-label="Next month">›</button></div></div>
      <div id="cal"></div></section>
    <section class="panel card"><div class="card-head"><h2>By strategy</h2><span class="muted" style="font-size:13px">all time</span></div>
      <div class="scroll"><table><thead><tr><th>Strategy</th><th class="r">Trades</th><th class="r">Win %</th><th class="r">P&amp;L</th></tr></thead><tbody>
      ${(D.strategies || []).map(s => `<tr><td><b>${esc(s[0])}</b></td><td class="r num">${s[1]}</td><td class="r num">${Math.round(s[2] / s[1] * 100)}%</td><td class="r num ${cls(s[3])}">${money(s[3])}</td></tr>`).join("") || '<tr><td colspan="4" class="muted">No closed trades yet.</td></tr>'}
      </tbody></table></div></section>
    ${D.full ? fullList(D.full.filter(t => !t.c || !b || (t.c >= b[0] && t.c <= b[1]))) : D.trades ? tradeList(D.trades.filter(t => !b || (t[1] >= b[0] && t[1] <= b[1]))) : ""}`;
  renderCal(days);
}
function lineChart(pts){
  if (!pts.length) return `<div class="empty" style="padding:24px">No closed trades in this timeframe.</div>`;
  const W = 640, H = 230, ml = 58, mr = 12, mt = 10, mb = 24;
  const vals = [0, ...pts.map(p => p[1])], lo = Math.min(...vals), hi = Math.max(...vals), span = (hi - lo) || 1;
  const step = Math.pow(10, Math.floor(Math.log10(span / 4))), nice = [1, 2, 2.5, 5, 10].map(m => m * step).find(s => span / s <= 5) || step * 10;
  const y0 = Math.floor(lo / nice) * nice, y1 = Math.ceil(hi / nice) * nice, ticks = []; for (let v = y0; v <= y1 + nice / 1e6; v += nice) ticks.push(v);
  const X = i => ml + (W - ml - mr) * (pts.length === 1 ? 0.5 : i / (pts.length - 1)), Y = v => mt + (H - mt - mb) * (1 - (v - y0) / (y1 - y0 || 1));
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const last = pts[pts.length - 1], col = last[1] >= 0 ? "var(--gain)" : "var(--loss)";
  const lab = [0, Math.floor((pts.length - 1) / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative P&L, ending at ${money(last[1])}">
    ${ticks.map(v => `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" ${Math.abs(v) < 1e-9 ? 'stroke-width="1.5"' : ""}/><text x="${ml - 8}" y="${Y(v) + 4}" text-anchor="end">${money0(v)}</text>`).join("")}
    <path d="${line}L${X(pts.length - 1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${col}" opacity=".1"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    ${lab.map(i => `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === pts.length - 1 ? "end" : "middle"}">${fmtShort(pts[i][0])}</text>`).join("")}
    <circle cx="${X(pts.length - 1)}" cy="${Y(last[1])}" r="4.5" fill="${col}" stroke="var(--surface)" stroke-width="2"/></svg>`;
}
function barChart(rows){
  if (!rows.length) return `<div class="empty" style="padding:24px">No closed trades in this timeframe.</div>`;
  const W = 420, H = 230, ml = 52, mr = 8, mt = 10, mb = 24, max = Math.max(1, ...rows.map(r => Math.abs(r[1])));
  const hasNeg = rows.some(r => r[1] < 0), hasPos = rows.some(r => r[1] > 0);
  const top = hasPos ? max : 0, bot = hasNeg ? -max : 0, Y = v => mt + (H - mt - mb) * (top - v) / ((top - bot) || 1);
  const bw = (W - ml - mr) / rows.length, gap = Math.min(10, bw * 0.25);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="P&L by month">
    <line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1.5"/>
    ${hasPos ? `<text x="${ml - 6}" y="${Y(top) + 8}" text-anchor="end">${compact(top)}</text>` : ""}${hasNeg ? `<text x="${ml - 6}" y="${Y(bot)}" text-anchor="end">${compact(bot)}</text>` : ""}<text x="${ml - 6}" y="${Y(0) + 4}" text-anchor="end">$0</text>
    ${rows.map((r, i) => { const x = ml + i * bw + gap / 2, h = Math.abs(Y(r[1]) - Y(0)), y = r[1] >= 0 ? Y(r[1]) : Y(0);
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw - gap).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}" rx="3" fill="${r[1] >= 0 ? "var(--gain)" : "var(--loss)"}"><title>${MON[+r[0].slice(5) - 1]} ${r[0].slice(0, 4)}: ${money(r[1])}</title></rect>
        ${rows.length <= 12 || i % Math.ceil(rows.length / 12) === 0 ? `<text x="${(x + (bw - gap) / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${MON[+r[0].slice(5) - 1]}</text>` : ""}`; }).join("")}</svg>`;
}
function renderCal(days){
  const byDay = Object.fromEntries(days.map(r => [r[0], r]));
  const month = calMonth || (days.length ? days[days.length - 1][0].slice(0, 7) : todayISO().slice(0, 7));
  const [y, m] = month.split("-").map(Number);
  $("#calM").textContent = `${MON[m - 1]} ${y}`; $("#calM").dataset.month = month;
  const lead = (new Date(y, m - 1, 1).getDay() + 6) % 7, dim = new Date(y, m, 0).getDate();
  const inMonth = days.filter(r => r[0].startsWith(month)), max = Math.max(1, ...inMonth.map(r => Math.abs(r[1])));
  const tone = v => { if (Math.abs(v) < 0.005) return ""; const k = Math.abs(v) / max > 0.66 ? 3 : Math.abs(v) / max > 0.33 ? 2 : 1; return (v > 0 ? "g" : "l") + k; };
  const cells = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<div class="dow">${d}</div>`);
  for (let i = 0; i < Math.ceil((lead + dim) / 7) * 7; i++){
    const d = i - lead + 1;
    if (d < 1 || d > dim){ cells.push('<div class="cday out"></div>'); continue; }
    const iso = `${month}-${pad2(d)}`, r = byDay[iso];
    cells.push(`<div class="cday ${r ? tone(r[1]) : ""}" title="${esc(fmtShort(iso) + (r ? `: ${money(r[1])} from ${r[2]} trade${r[2] === 1 ? "" : "s"}` : ""))}"><span class="d">${d}</span>${r ? `<span class="v">${compact(r[1])}</span>` : ""}</div>`);
  }
  const mt = inMonth.reduce((a, r) => a + r[1], 0);
  $("#cal").innerHTML = `<div class="muted" style="font-size:13px;margin-bottom:6px">Month <b class="num ${cls(mt)}">${inMonth.length ? money(mt) : "—"}</b> · ${inMonth.reduce((a, r) => a + r[2], 0)} trades</div><div class="cal">${cells.join("")}</div>`;
}
/* ---- full trade details (for studying entries and exits) ---- */
let fullFilter = "all", fullLimit = 100, openRow = -1;
const fmtK = k => String(Math.round(k * 100) / 100);
const intrinsic = (t, k, S) => t === "C" ? Math.max(0, S - k) : Math.max(0, k - S);
const sameExpiry = t => t.l.length && new Set(t.l.map(l => l.x)).size === 1;
const valueAt = (t, S) => t.l.reduce((a, l) => a + l.q * intrinsic(l.t, l.k, S), 0);
const pnlAt = (t, S) => (t.a === "BUY" ? 1 : -1) * (valueAt(t, S) - t.e) * t.q * t.m - (t.f || 0);
function risk(t){
  if (!sameExpiry(t) || t.e == null) return null;
  const ks = [...new Set(t.l.map(l => l.k))].sort((a, b) => a - b), big = ks[ks.length - 1] * 10, xs = [0, ...ks, big], ys = xs.map(S => pnlAt(t, S));
  const callNet = t.l.filter(l => l.t === "C").reduce((a, l) => a + l.q, 0) * (t.a === "BUY" ? 1 : -1);
  let maxP = Math.max(...ys), maxL = Math.min(...ys); if (callNet > 0) maxP = Infinity; if (callNet < 0) maxL = -Infinity;
  const be = []; for (let i = 0; i < xs.length - 1; i++){ const [y0, y1] = [ys[i], ys[i + 1]]; if ((y0 < 0 && y1 > 0) || (y0 > 0 && y1 < 0)) be.push(xs[i] + (xs[i + 1] - xs[i]) * (-y0) / (y1 - y0)); }
  return {ks, maxP, maxL, be};
}
function payoff(t, rp){
  const ks = rp.ks, pad = Math.max((ks[ks.length - 1] - ks[0]) * 1.2, ks[ks.length - 1] * 0.006, 1);
  let lo = Math.max(0, ks[0] - pad), hi = ks[ks.length - 1] + pad;
  if (t.sv != null){ lo = Math.max(0, Math.min(lo, t.sv - pad * 0.3)); hi = Math.max(hi, t.sv + pad * 0.3); }
  const xs = [lo, ...ks.filter(k => k > lo && k < hi), hi], ys = xs.map(S => pnlAt(t, S));
  const W = 520, H = 200, ml = 58, mr = 10, mt = 10, mb = 24, ymin = Math.min(0, ...ys), ymax = Math.max(0, ...ys), yr = (ymax - ymin) || 1;
  const X = S => ml + (W - ml - mr) * (S - lo) / (hi - lo), Y = v => mt + (H - mt - mb) * (1 - (v - ymin) / yr);
  const line = xs.map((S, i) => `${i ? "L" : "M"}${X(S).toFixed(1)},${Y(ys[i]).toFixed(1)}`).join(""), zy = Y(0), uid = Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Payoff at expiration">
    <defs><clipPath id="u${uid}"><rect x="0" y="0" width="${W}" height="${zy}"/></clipPath><clipPath id="d${uid}"><rect x="0" y="${zy}" width="${W}" height="${H}"/></clipPath></defs>
    <line x1="${ml}" x2="${W - mr}" y1="${zy}" y2="${zy}" stroke="var(--line)" stroke-width="1.5"/>
    ${Math.abs(Y(ymax) - zy) > 14 ? `<text x="${ml - 6}" y="${Y(ymax) + 9}" text-anchor="end">${compact(ymax)}</text>` : ""}${Math.abs(Y(ymin) - zy) > 14 ? `<text x="${ml - 6}" y="${Y(ymin)}" text-anchor="end">${compact(ymin)}</text>` : ""}<text x="${ml - 6}" y="${zy + 4}" text-anchor="end">$0</text>
    ${ks.map(k => `<line x1="${X(k)}" x2="${X(k)}" y1="${mt}" y2="${H - mb}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("")}
    ${(() => { let last = -1e9; return ks.map(k => { const x = X(k); if (x - last < 38) return ""; last = x; return `<text x="${x}" y="${H - 7}" text-anchor="middle">${fmtK(k)}</text>`; }).join(""); })()}
    <path d="${line}L${X(hi)},${zy}L${X(lo)},${zy}Z" fill="var(--gain)" opacity=".16" clip-path="url(#u${uid})"/><path d="${line}L${X(hi)},${zy}L${X(lo)},${zy}Z" fill="var(--loss)" opacity=".16" clip-path="url(#d${uid})"/>
    <path d="${line}" fill="none" stroke="var(--gain)" stroke-width="2" clip-path="url(#u${uid})"/><path d="${line}" fill="none" stroke="var(--loss)" stroke-width="2" clip-path="url(#d${uid})"/>
    ${t.sv != null ? `<line x1="${X(t.sv)}" x2="${X(t.sv)}" y1="${mt}" y2="${H - mb}" stroke="var(--accent)" stroke-width="1.5"/><text x="${X(t.sv) + 5}" y="${mt + 10}" style="fill:var(--accent)">settled ${fmtK(t.sv)}</text>` : ""}</svg>`;
}
function statusPill(t){
  if (t.st === "open") return '<span class="pill open">Open</span>';
  if (t.st === "due") return '<span class="pill open">Expired, not settled</span>';
  const c = t.p > 0.005 ? "win" : t.p < -0.005 ? "lossp" : "flat";
  return `<span class="pill ${c}">${t.xk === "expired" ? "Expired" : "Closed"}</span>`;
}
function fullList(all){
  const rows = all.filter(t => fullFilter === "all" || (fullFilter === "open" ? t.p == null : t.p != null))
    .sort((a, b) => (b.c || "9999").localeCompare(a.c || "9999") || b.o.localeCompare(a.o));
  const shown = rows.slice(0, fullLimit);
  const cash = t => (t.a === "BUY" ? -1 : 1) * t.e * t.q * t.m;
  const counts = {all: all.length, open: all.filter(t => t.p == null).length, closed: all.filter(t => t.p != null).length};
  return `<section class="panel card"><div class="card-head"><h2>Trades</h2>
      <div class="tabs" role="group" aria-label="Which trades">${[["all","All"],["open","Open"],["closed","Closed"]].map(([k, n]) => `<button type="button" data-ff="${k}" aria-pressed="${fullFilter === k}">${n} <span class="muted">${counts[k]}</span></button>`).join("")}</div></div>
    <div class="scroll"><table><thead><tr><th class="hide-sm">Opened</th><th>Strategy</th><th class="r hide-sm">Lots</th><th class="r">Entry</th><th class="r hide-sm">Exit</th><th class="r hide-sm">Fees</th><th class="r">P&amp;L</th><th class="hide-sm">Status</th></tr></thead><tbody>
    ${shown.map((t, i) => { const c = cash(t);
      return `<tr class="trow" data-row="${i}" tabindex="0" aria-expanded="${openRow === i}">
        <td class="num hide-sm" style="white-space:nowrap">${t.o ? fmtShort(t.o) : "—"}</td>
        <td><b>${esc(t.s)}</b><div class="sub">${esc(t.u)} ${t.x ? fmtShort(t.x) : ""} · ${esc(t.k)} ${esc(t.ty)}<span class="show-sm"> · ${t.q} lot${t.q === 1 ? "" : "s"}</span></div></td>
        <td class="r num hide-sm">${t.q}</td>
        <td class="r num">${t.e == null ? "—" : t.e.toFixed(2)}<div class="sub hide-sm">${t.e == null ? "" : (c >= 0 ? "cr " : "db ") + money0(Math.abs(c))}</div></td>
        <td class="r num hide-sm">${t.xp == null ? "—" : t.xp.toFixed(2)}${t.c ? `<div class="sub">${fmtShort(t.c)}</div>` : ""}</td>
        <td class="r num hide-sm muted">${money0(t.f || 0)}</td>
        <td class="r num ${cls(t.p ?? 0)}" style="font-weight:700;white-space:nowrap">${t.p == null ? "—" : money(t.p)}</td>
        <td class="hide-sm">${statusPill(t)}</td></tr>
        ${openRow === i ? `<tr class="drow"><td colspan="8">${detail(t)}</td></tr>` : ""}`; }).join("") || '<tr><td colspan="8" class="muted">No trades in this view.</td></tr>'}
    </tbody></table></div>
    ${rows.length > shown.length ? `<button class="btn" type="button" data-more="1" style="justify-self:center">Show more (${rows.length - shown.length} left)</button>` : ""}
    <span class="muted" style="font-size:12.5px">Tap a trade to see its order, legs and payoff graph.</span></section>`;
}
function detail(t){
  const rp = risk(t), dir = t.a === "BUY" ? 1 : -1;
  const legs = t.l.map(l => { const n = l.q * dir * t.q; return `<span>${n > 0 ? "Long" : "Short"} ${Math.abs(n)} × ${fmtK(l.k)} ${l.t === "C" ? "call" : "put"} · ${fmtShort(l.x)}</span>`; }).join("");
  return `<div class="det"><div style="display:grid;gap:10px;align-content:start">
      ${t.r ? `<div class="order">${esc(t.r)}</div>` : ""}
      <div class="facts">
        <div><span class="label">Opened</span><span class="v">${t.o ? fmtShort(t.o) : "—"}</span></div>
        <div><span class="label">Entry</span><span class="v">${t.e == null ? "—" : t.e.toFixed(2)}</span></div>
        <div><span class="label">Exit</span><span class="v">${t.xp == null ? "—" : t.xp.toFixed(2)}</span></div>
        <div><span class="label">${t.xk === "expired" ? "Settled at" : "Closed"}</span><span class="v">${t.sv != null ? fmtK(t.sv) : t.c ? fmtShort(t.c) : "—"}</span></div>
        <div><span class="label">Fees</span><span class="v">${money0(t.f || 0)}</span></div>
        <div><span class="label">Max profit</span><span class="v gain">${rp ? (isFinite(rp.maxP) ? money(rp.maxP) : "Unlimited") : "—"}</span></div>
        <div><span class="label">Max loss</span><span class="v loss">${rp ? (isFinite(rp.maxL) ? money(rp.maxL) : "Unlimited") : "—"}</span></div>
        <div><span class="label">Breakeven</span><span class="v">${rp && rp.be.length ? rp.be.map(v => fmtK(v)).join(" / ") : "—"}</span></div>
        <div><span class="label">P&amp;L</span><span class="v ${cls(t.p ?? 0)}">${t.p == null ? "open" : money(t.p)}</span></div>
      </div>
      <div class="legs">${legs}</div>
      ${t.n ? `<div class="muted" style="font-size:13px">Note: ${esc(t.n)}</div>` : ""}
    </div>
    <div>${rp ? `<div class="label" style="margin-bottom:4px">P&amp;L at expiration</div>${payoff(t, rp)}` : '<span class="muted">No payoff graph for this structure.</span>'}</div></div>`;
}
function tradeList(rows){
  // rows: [opened, closed, strategy, symbol, contracts, pnl]
  rows = rows.slice().sort((a, c) => c[1].localeCompare(a[1]));
  const shown = rows.slice(0, 150);
  return `<section class="panel card"><div class="card-head"><h2>Closed trades</h2><span class="muted" style="font-size:13px">${rows.length}${rows.length > shown.length ? ` · latest ${shown.length} shown` : ""}</span></div>
    <div class="scroll"><table><thead><tr><th>Closed</th><th>Strategy</th><th>Symbol</th><th class="r">Lots</th><th class="r">P&amp;L</th></tr></thead><tbody>
    ${shown.map(t => `<tr><td class="num">${fmtShort(t[1])}</td><td>${esc(t[2])}</td><td class="num">${esc(t[3])}</td><td class="r num">${t[4]}</td><td class="r num ${cls(t[5])}" style="font-weight:600">${money(t[5])}</td></tr>`).join("") || '<tr><td colspan="5" class="muted">No closed trades in this timeframe.</td></tr>'}
    </tbody></table></div></section>`;
}
document.addEventListener("click", ev => {
  const r = ev.target.closest("[data-range]");
  if (r){ range = r.dataset.range; calMonth = ""; openRow = -1; fullLimit = 100; try { localStorage.setItem("ledger-view-range", range); } catch {} render(); return; }
  const ff = ev.target.closest("[data-ff]");
  if (ff){ fullFilter = ff.dataset.ff; fullLimit = 100; openRow = -1; render(); return; }
  const mr = ev.target.closest("[data-more]");
  if (mr){ fullLimit += 100; render(); return; }
  const tr = ev.target.closest("tr.trow");
  if (tr){ const i = +tr.dataset.row; openRow = openRow === i ? -1 : i; render(); return; }
  const c = ev.target.closest("[data-cal]");
  if (c){ const [y, m] = ($("#calM").dataset.month || todayISO().slice(0, 7)).split("-").map(Number); const d = new Date(y, m - 1 + (+c.dataset.cal), 1); calMonth = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    const b = bounds(); renderCal((data.daily || []).filter(x => !b || (x[0] >= b[0] && x[0] <= b[1])).sort((a, e) => a[0].localeCompare(e[0]))); }
});
document.addEventListener("keydown", ev => { if (ev.key === "Enter" && ev.target.matches("tr.trow")) ev.target.click(); });
load();
</script>
