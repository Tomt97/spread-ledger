name: Update closing prices

on:
  schedule:
    # Weekdays after the 4:00 pm New York close (UTC times cover daylight and standard time)
    - cron: "40 20 * * 1-5"
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch closes
        run: node .github/scripts/update-prices.mjs
      - name: Commit prices.json
        run: |
          if git diff --quiet -- prices.json; then echo "No new prices"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "Update closing prices"
          git push
