name: Update option quotes
# Also builds market.json (ES charts in SPX points, GEX, levels, 1DTE/2DTE ranges) and keeps the prediction log.

on:
  push:
    branches: [probe-events]
  schedule:
    # Every 15 minutes (off the top of the hour, when GitHub is busiest), weekdays, wide enough to cover
    # 9:30 am - 4:15 pm New York in daylight and standard time. GitHub may run scheduled jobs late or
    # skip some; the app shows the quote time.
    - cron: "7,22,37,52 13-21 * * 1-5"
  # Also started every hour by a free cron-job.org job (see README), because GitHub's own schedule
  # often runs only once or twice a day on small repositories.
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even when the market is closed"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: quotes
  cancel-in-progress: false     # never cut a run off mid-publish; the prediction log lives on the quotes branch

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            config.js
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Get the files already published
        run: |
          mkdir prev
          if git fetch -q --depth=1 origin quotes; then git --work-tree=prev checkout FETCH_HEAD -- . ; fi
          ls -l prev
      - name: Fetch delayed quotes
        continue-on-error: true
        run: node .github/scripts/update-quotes.mjs
        env:
          FORCE: "true"
      - name: Update the economic event calendar
        continue-on-error: true
        run: node .github/scripts/update-events.mjs
        env:
          PREV_EVENTS: prev/events.json
      - name: Build market data and score predictions
        continue-on-error: true
        run: node .github/scripts/update-market.mjs
        env:
          PRED_FILE: prev/predictions.json
      - name: Publish to the quotes branch
        run: |
          # One commit, replaced each time, so the repository history doesn't grow. Files not rebuilt this run are kept.
          mkdir pub && cp prev/*.json pub/ 2>/dev/null || true
          for f in quotes.json market.json predictions.json events.json; do if [ -f "$f" ]; then mv "$f" pub/; fi; done
          cd pub && ls -l
          git init -q -b quotes
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Delayed quotes and market data"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" quotes:probe-events-out
