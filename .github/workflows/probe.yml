name: Probe event calendars
on:
  push:
    branches: [probe-events]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw; UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          get(){ curl -sSL --compressed -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -H "Accept: text/html,application/xhtml+xml" -o "raw/$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> raw/status.txt 2>&1 || echo "$1 failed" >> raw/status.txt; }
          get fed-current.html https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm
          for y in 2021 2022 2023 2024 2025; do get fed-$y.html https://www.federalreserve.gov/monetarypolicy/fomchistorical$y.htm; done
          for r in cpi empsit ppi; do get bls-$r.html https://www.bls.gov/schedule/news_release/$r.htm; done
          for y in 2023 2024 2025 2026; do get bls-sched-$y.html https://www.bls.gov/schedule/${y}_sched.htm; done
          get bea.html https://www.bea.gov/news/schedule
          get bea-full.html https://www.bea.gov/news/schedule/full
          get nyse-hol.html https://www.nyse.com/markets/hours-calendars
          cat raw/status.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw; git commit -m "probe results"; git push
