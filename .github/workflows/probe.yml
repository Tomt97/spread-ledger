name: Probe event calendars
on:
  push:
    branches: [probe-events]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p raw; UA="Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Safari/605.1.15"
          get(){ curl -sSL --compressed -A "$UA" -H "Accept-Language: en-US,en;q=0.9" -H "Accept: text/html,application/xhtml+xml" -o "raw/$1" -w "$1 %{http_code} %{size_download}\n" "$2" >> raw/status.txt 2>&1 || echo "$1 failed" >> raw/status.txt; }
          rm -f raw/*; for r in cpi empsit ppi; do get arch-$r.html https://www.bls.gov/bls/news-release/$r.htm; done
          get census-retail.html https://www.census.gov/retail/release_schedule.html
          get bea-arch-pi.html https://www.bea.gov/news/archive?field_related_product_target_id=451
          cat raw/status.txt
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw; git commit -m "probe results"; git push
